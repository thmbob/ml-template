channels:
  - conda-forge

# Base commune à toutes les plateformes.
# La pile PyTorch vit dans environment.gpu.yml / environment.cpu.yml,
# parce qu'elle est la seule partie qui dépend du matériel.
#
# Convention de bornage :
#   >=X.Y  borne basse = version minimale réellement testée
#   <N     borne haute = prochaine majeure (protège des ruptures d'API)
dependencies:
  - python=3.10

  # Data & Math
  - numpy>=1.26,<3
  - pandas>=2.2,<3
  - scikit-learn>=1.5,<2
  - scipy>=1.13,<2
  - sympy>=1.12,<2
  - mpmath>=1.3,<2
  - pulp>=2.8,<3

  # Visualisation & Logs
  - matplotlib>=3.9,<4
  - seaborn>=0.13,<1
  - jupyterlab>=4.2,<5
  - tqdm>=4.66,<5
  - rich>=13.7,<15

  # Outils de dev (analyse statique, formatage, tests)
  # ruff doit rester aligné sur le `rev` de .pre-commit-config.yaml,
  # sinon `make format` et le hook git se contredisent.
  - ruff=0.5.5
  - mypy>=1.11,<2
  - pytest>=8.2,<9
  - pre-commit>=3.7,<5
  - conda-lock>=2.5,<4
  - pip
